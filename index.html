<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R20 Esports - Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
  body{background:#0a0a0a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 400px at 20% 10%, rgba(255,26,26,0.15), transparent), radial-gradient(600px 300px at 90% 90%, rgba(255,26,26,0.08), transparent), #0a0a0a}
 .card{width:100%;max-width:420px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px;backdrop-filter:blur(20px)}
  h1{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
  h1 span{color:#ff1a1a}
 .sub{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:24px}
  label{font-size:11px;letter-spacing:1px;color:rgba(255,255,255,0.5);display:block;margin:14px 0 6px}
  input{width:100%;height:46px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:0 14px;color:white;outline:none}
  input:focus{border-color:rgba(255,26,26,0.6)}
  button{width:100%;height:46px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:16px}
 .primary{background:linear-gradient(#ff2a2a,#cc0000);color:white;letter-spacing:1px}
 .secondary{background:rgba(255,255,255,0.06);color:white;border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;gap:10px}
 .error{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);padding:10px;border-radius:10px;font-size:12px;color:#ffb3b3;margin-top:12px;display:none}
 .success{background:rgba(0,255,100,0.1);border:1px solid rgba(0,255,100,0.3);padding:10px;border-radius:10px;font-size:12px;color:#b3ffcc;margin-top:12px;display:none}
 .toggle{text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,0.5)}
 .toggle span{color:#ff1a1a;cursor:pointer;font-weight:700}
 .dashboard{display:none}
 .codebox{background:black;border:1px solid rgba(255,255,255,0.1);padding:12px;border-radius:10px;font-size:11px;margin-top:16px;color:rgba(255,255,255,0.6)}
</style>
</head>
<body>

<div class="card" id="authCard">
  <h1><span>R20</span> ESPORTS</h1>
  <div class="sub">তোমার Firebase দিয়ে আসল লগইন সিস্টেম</div>

  <div id="loginForm">
    <label>EMAIL</label>
    <input id="email" type="email" placeholder="gamer@r20.com">
    <label>PASSWORD</label>
    <input id="password" type="password" placeholder="••••••••">

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <button class="primary" id="mainBtn" onclick="handleAuth()">LOGIN • লগইন করুন</button>
    <button class="secondary" onclick="googleLogin()"> <span style="background:white;color:black;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12px">G</span> Google দিয়ে লগইন</button>

    <div class="toggle"><span id="toggleText" onclick="toggleMode()">নতুন একাউন্ট খুলুন? Sign Up</span></div>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="success" style="display:block" id="welcomeMsg"></div>
    <div class="codebox" id="userInfo"></div>
    <button class="primary" onclick="logout()">LOGOUT • বের হোন</button>
  </div>

  <div class="codebox">
    ✅ এই কোডটা তোমার <b>r20-esports</b> প্রজেক্টে কানেক্টেড<br>
    🔧 Firebase Console > Authentication > Email/Password & Google Enable করতে হবে
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // তোমার দেওয়া কনফিগ - এটাই আসল
  const firebaseConfig = {
    apiKey: "AIzaSyD6uFXH6PtNK1G6MA7IdgVI1YrrWe81I44",
    authDomain: "r20-esports.firebaseapp.com",
    projectId: "r20-esports",
    storageBucket: "r20-esports.firebasestorage.app",
    messagingSenderId: "1093098377356",
    appId: "1:1093098377356:web:ca32c25bf149e317bceba9",
    measurementId: "G-28FJ7LF6TL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let isLogin = true;

  window.toggleMode = () => {
    isLogin =!isLogin;
    document.getElementById('mainBtn').innerText = isLogin? "LOGIN • লগইন করুন" : "SIGN UP • একাউন্ট খুলুন";
    document.getElementById('toggleText').innerText = isLogin? "নতুন একাউন্ট খুলুন? Sign Up" : "আগে একাউন্ট আছে? Login";
    hideMessages();
  }

  window.handleAuth = async () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    if(!email ||!pass){ showError("Email এবং Password দিতে হবে!"); return; }

    const btn = document.getElementById('mainBtn');
    btn.innerText = "LOADING...";
    btn.disabled = true;

    try {
      if(isLogin){
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", cred.user.uid), {
          email: cred.user.email,
          uid: cred.user.uid,
          createdAt: new Date().toISOString()
        });
      }
    } catch(e){
      showError(translate(e.code));
    } finally {
      btn.innerText = isLogin? "LOGIN • লগইন করুন" : "SIGN UP • একাউন্ট খুলুন";
      btn.disabled = false;
    }
  }

  window.googleLogin = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      await setDoc(doc(db, "users", result.user.uid), {
        email: result.user.email,
        name: result.user.displayName,
        provider: "google",
        createdAt: new Date().toISOString()
      }, {merge:true});
    } catch(e){
      showError(translate(e.code));
    }
  }

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    if(user){
      document.getElementById('loginForm').style.display = "none";
      document.getElementById('dashboard').style.display = "block";
      document.getElementById('welcomeMsg').innerText = `✅ লগইন সফল! Welcome ${user.email}`;
      document.getElementById('userInfo').innerHTML = `UID: ${user.uid}<br>Email: ${user.email}<br>Provider: ${user.providerData[0]?.providerId}<br><br>এই ইউজার এখন তোমার Firestore Database > users collection এ সেভ হয়েছে।`;
    } else {
      document.getElementById('loginForm').style.display = "block";
      document.getElementById('dashboard').style.display = "none";
    }
  });

  function showError(msg){
    const box = document.getElementById('errorBox');
    box.innerText = msg;
    box.style.display = "block";
  }
  function hideMessages(){
    document.getElementById('errorBox').style.display = "none";
  }
  function translate(code){
    const m = {
      "auth/invalid-credential":"Email/Password ভুল! বা একাউন্ট নেই, Sign Up করুন।",
      "auth/user-not-found":"User পাওয়া যায়নি! আগে Sign Up করুন।",
      "auth/wrong-password":"ভুল পাসওয়ার্ড!",
      "auth/email-already-in-use":"এই Email দিয়ে আগেই একাউন্ট আছে, Login করুন।",
      "auth/weak-password":"Password কমপক্ষে ৬ অক্ষরের হতে হবে!",
      "auth/operation-not-allowed":"Firebase Console এ Email/Password Enable করা নেই!",
      "auth/popup-closed-by-user":"Google popup বন্ধ করেছেন।"
    }
    return m[code] || code;
  }
</script>
</body>
</html>
