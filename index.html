// ============ USERNAME UNIQUE SYSTEM ============
async function checkUsername(username){
  const ref = db.collection('usernames').doc(username.toLowerCase());
  const snap = await ref.get();
  return!snap.exists;
}

async function saveUsername(username){
  const lower = username.toLowerCase();
  const available = await checkUsername(lower);
  if(!available){ alert("❌ Username Taken! অন্য নাম দিন"); return; }

  const batch = db.batch();
  batch.set(db.collection('usernames').doc(lower), {uid: currentUser.uid, email: currentUser.email, username: username});
  batch.set(db.collection('users').doc(currentUser.uid), {
    uid: currentUser.uid,
    email: currentUser.email,
    username: username,
    balance: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});
  await batch.commit();
  initApp();
}

function showUsernameSetup(){
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-6">

      <p class="text-zinc-400 mb-4">একটি Unique Username দিন - এটি দিয়ে আপনাকে চিনবো</p>
      <input id="uname" class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-2" placeholder="যেমন Tomal007">
      <p id="unameStatus" class="text-sm mb-4"></p>
      <button onclick="checkLive()" class="w-full orange p-3 rounded-xl font-bold">Check & Save</button>
    </div>
  </div>`;
  document.getElementById('uname').addEventListener('input', async (e)=>{
    const v = e.target.value.trim();
    if(v.length<3) return;
    const ok = await checkUsername(v);
    document.getElementById('unameStatus').innerHTML = ok? '<span class="text-green-400">✅ Available</span>' : '<span class="text-red-400">❌ Taken</span>';
  });
}
window.checkLive = async ()=>{
  const u = document.getElementById('uname').value.trim();
  if(u.length<3){alert("3 অক্ষরের বেশি দিন");return}
  await saveUsername(u);
}

window.switchTab = (t)=>{
  if(t==='login'){
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('regForm').classList.add('hidden');
    document.getElementById('tabLogin').className='flex-1 p-3 rounded-xl bg-white text-black font-bold';
    document.getElementById('tabReg').className='flex-1 p-3 rounded-xl bg-zinc-800';
  } else {
    document.getElementById('regForm').classList.remove('hidden');
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('tabReg').className='flex-1 p-3 rounded-xl bg-white text-black font-bold';
    document.getElementById('tabLogin').className='flex-1 p-3 rounded-xl bg-zinc-800';
  }
}

window.doLogin = async ()=>{
  const email = document.getElementById('lEmail').value;
  const pass = document.getElementById('lPass').value;
  if(!email ||!pass){ alert("⚠️ আপনার Account নেই! নতুন প্লেয়ার হলে Registration করুন। Registration এ Email, Username ও শক্তিশালী Password দিয়ে Account খুলুন।"); return; }
  try{ await auth.signInWithEmailAndPassword(email, pass); } catch(e){ alert(e.message); }
}

window.doRegister = async ()=>{
  const username = document.getElementById('rUsername').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const pass = document.getElementById('rPass').value;
  const cpass = document.getElementById('rCPass').value;

  if(!username ||!email ||!pass){ alert("সব ঘর পূরণ করুন"); return; }
  if(pass!== cpass){ alert("Password মিলেনি"); return; }
  if(pass.length<6 ||!/[A-Z]/.test(pass) ||!/[0-9]/.test(pass)){ alert("শক্তিশালী Password দিন: 6+ অক্ষর, 1 বড় হাতের, 1 Number"); return; }

  const ok = await checkUsername(username);
  if(!ok){ alert("❌ Username Taken!"); return; }

  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await saveUsername(username);
  } catch(e){ alert(e.message); }
}

window.googleLogin = async ()=>{
  const provider = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(provider); } catch(e){ alert(e.message); }
}

// ============ PUSH NOTIFICATION (Option 10) ============
async function setupPush(){
  try{
    const permission = await Notification.requestPermission();
    if(permission === 'granted'){
      const token = await messaging.getToken({vapidKey: VAPID_KEY});
      await db.collection('fcmTokens').doc(currentUser.uid).set({token, username: userProfile.username, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
      console.log("Push Token Saved:", token);
    }
  } catch(e){ console.log("Push Error", e); }
}

messaging.onMessage((payload)=>{
  new Notification(payload.notification.title, {body: payload.notification.body});
});

// ============ PWA SERVICE WORKER (Option 5 - Manual কাজ নেই) ============
if('serviceWorker' in navigator){
  const swCode = `self.addEventListener('fetch', e=>{ e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))) });`;
  const blob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl);
}
