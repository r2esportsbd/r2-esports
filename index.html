<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2.0 ESPORTS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .active-tab {
            color: #ef4444;
            border-bottom: 2px solid #ef4444;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 glass-card px-4 py-3 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <!-- App Main Logo Fix -->
            <img id="appMainLogo" src="https://d3tx3wg2jy0sui.cloudfront.net/5a5b856849944b3dba3eb46aa729cb5a.jpg" alt="R2.0 Logo" class="w-10 h-10 rounded-lg object-cover border border-red-500/30">
            <h1 class="text-xl font-bold tracking-wider text-white">R2.0 <span class="text-red-500">ESPORTS</span></h1>
        </div>
        <div id="authStatus" class="flex items-center space-x-2">
            <button id="loginBtn" onclick="openAuthModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Login</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Banner / Announcement -->
        <div class="relative overflow-hidden rounded-2xl glass-card p-4 border border-red-500/20">
            <div class="flex items-center justify-between">
                <div>
                    <span class="bg-red-500/20 text-red-400 text-xs px-2 py-0.5 rounded font-semibold">NOTICE</span>
                    <h2 class="text-lg font-semibold mt-1">Daily eSports Tournaments</h2>
                    <p class="text-xs text-gray-400">Play matches, win rewards & cashout instantly!</p>
                </div>
                <i class="fa-solid fa-gamepad text-4xl text-red-500/40"></i>
            </div>
        </div>

        <!-- Section Navigation Tabs -->
        <div class="flex space-x-2 border-b border-gray-800 pb-2 overflow-x-auto text-sm font-medium">
            <button onclick="switchTab('play')" id="tab-play" class="active-tab px-4 py-1.5 whitespace-nowrap">Play</button>
            <button onclick="switchTab('matches')" id="tab-matches" class="text-gray-400 px-4 py-1.5 whitespace-nowrap">My Matches</button>
            <button onclick="switchTab('results')" id="tab-results" class="text-gray-400 px-4 py-1.5 whitespace-nowrap">Results</button>
            <button onclick="switchTab('wallet')" id="tab-wallet" class="text-gray-400 px-4 py-1.5 whitespace-nowrap">Wallet</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="text-gray-400 px-4 py-1.5 whitespace-nowrap hidden">Admin Panel</button>
        </div>

        <!-- PLAY TAB CONTENT -->
        <div id="view-play" class="space-y-4">
            <h2 class="text-lg font-semibold flex items-center space-x-2">
                <i class="fa-solid fa-gamepad text-red-500"></i>
                <span id="gameModeTitle">BR SOLO MATCH</span>
            </h2>

            <!-- Tournament List -->
            <div id="tournamentList" class="space-y-4">
                <!-- Dynamic Tournament Cards Will Load Here -->
            </div>
        </div>

        <!-- MATCHES TAB CONTENT -->
        <div id="view-matches" class="hidden space-y-4">
            <h2 class="text-lg font-semibold">Joined Matches</h2>
            <div id="myMatchesList" class="space-y-4 text-sm text-gray-400">
                <p>No joined matches found.</p>
            </div>
        </div>

        <!-- RESULTS TAB CONTENT -->
        <div id="view-results" class="hidden space-y-4">
            <h2 class="text-lg font-semibold">Match Results</h2>
            <div id="resultsList" class="space-y-4 text-sm text-gray-400">
                <p>No match results published yet.</p>
            </div>
        </div>

        <!-- WALLET TAB CONTENT -->
        <div id="view-wallet" class="hidden space-y-4">
            <div class="glass-card p-5 rounded-2xl border border-gray-800 text-center space-y-2">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Total Balance</span>
                <div class="text-3xl font-bold text-green-400"><span id="walletBalance">0</span> TK</div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openDepositModal()" class="bg-gray-800 hover:bg-gray-700 text-white py-2.5 rounded-xl text-sm font-medium border border-gray-700">Watch Ads (Earn)</button>
                <button onclick="openWithdrawModal()" class="bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-sm font-medium">Withdraw (bKash)</button>
            </div>
        </div>

        <!-- ADMIN PANEL TAB CONTENT -->
        <div id="view-admin" class="hidden space-y-4">
            <div class="glass-card p-4 rounded-2xl border border-gray-800 space-y-4">
                <h3 class="text-md font-semibold text-red-400 flex items-center space-x-2">
                    <i class="fa-solid fa-trophy"></i>
                    <span>Create Tournament</span>
                </h3>
                <form id="createTournamentForm" onsubmit="handleCreateTournament(event)" class="space-y-3 text-xs">
                    <input type="text" id="adminGameCategory" placeholder="Game Category (e.g. BR SOLO MATCH)" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <select id="adminType" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                        <option value="SOLO">SOLO</option>
                        <option value="DUO">DUO</option>
                        <option value="SQUAD">SQUAD</option>
                    </select>
                    <input type="text" id="adminTitle" placeholder="Title" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <!-- Image URL input with fallback info -->
                    <input type="url" id="adminImage" placeholder="Image URL (ফাঁকা রাখলে মূল লোগো বসবে)" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <input type="text" id="adminMatchTime" placeholder="Date & Time (e.g. Sep 8, 2026, 11:10 PM)" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <input type="text" id="adminMap" placeholder="Map (e.g. Bermuda)" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <input type="number" id="adminWinPrize" placeholder="Total Win Prize (BDT)" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <input type="number" id="adminPerKill" placeholder="Per Kill Reward (BDT)" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <input type="number" id="adminEntryFee" placeholder="Entry Fee (BDT)" required class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500">
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg font-medium text-sm transition">Publish Tournament</button>
                </form>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-gray-800 px-6 py-2 flex justify-between items-center text-center text-xs z-40">
        <button onclick="switchTab('play')" class="text-red-500 flex flex-col items-center space-y-1">
            <i class="fa-solid fa-gamepad text-lg"></i>
            <span>Play</span>
        </button>
        <button onclick="switchTab('matches')" class="text-gray-400 hover:text-white flex flex-col items-center space-y-1">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span>Matches</span>
        </button>
        <button onclick="switchTab('results')" class="text-gray-400 hover:text-white flex flex-col items-center space-y-1">
            <i class="fa-solid fa-trophy text-lg"></i>
            <span>Results</span>
        </button>
        <button onclick="switchTab('wallet')" class="text-gray-400 hover:text-white flex flex-col items-center space-y-1">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span>Profile</span>
        </button>
        <button onclick="switchTab('admin')" id="bottomNavAdmin" class="text-gray-400 hover:text-white flex flex-col items-center space-y-1 hidden">
            <i class="fa-solid fa-gear text-lg"></i>
            <span>Admin</span>
        </button>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // Default Logo URL Constant
        const DEFAULT_LOGO = "https://d3tx3wg2jy0sui.cloudfront.net/5a5b856849944b3dba3eb46aa729cb5a.jpg";

        // Sample Data Container
        let tournaments = [
            {
                id: 1,
                tag: "#VDNGP",
                title: "Free tournament with add 😱",
                time: "Sep 6, 2026, 11:10 PM",
                winPrize: 134,
                perKill: 2,
                entryFee: 10,
                type: "SOLO",
                map: "Bermuda",
                device: "MOBILE",
                spotsTotal: 48,
                spotsJoined: 0,
                image: DEFAULT_LOGO
            }
        ];

        // Function to render tournament cards safely
        function renderTournaments() {
            const container = document.getElementById('tournamentList');
            container.innerHTML = "";

            tournaments.forEach(item => {
                // Check if image URL is valid or fallback to DEFAULT_LOGO
                const imageUrl = (item.image && item.image.trim() !== "") ? item.image : DEFAULT_LOGO;

                const cardHTML = `
                    <div class="glass-card rounded-2xl p-4 border border-gray-800 space-y-3 relative">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <img src="${imageUrl}" 
                                     onerror="this.onerror=null;this.src='${DEFAULT_LOGO}';" 
                                     alt="Tournament" 
                                     class="w-14 h-14 rounded-xl object-cover border border-gray-700 bg-gray-900">
                                <div>
                                    <h3 class="font-medium text-sm text-white">${item.title}</h3>
                                    <p class="text-xs text-gray-400 mt-0.5"><i class="fa-regular fa-clock text-red-500 mr-1"></i>${item.time}</p>
                                </div>
                            </div>
                            <span class="bg-green-500/20 text-green-400 text-xs px-2 py-0.5 rounded font-semibold">${item.tag}</span>
                        </div>

                        <div class="grid grid-cols-3 gap-2 bg-gray-900/60 p-2.5 rounded-xl text-center text-xs">
                            <div>
                                <span class="text-gray-400 block text-[10px] uppercase">Win Prize</span>
                                <span class="font-bold text-white">${item.winPrize} TK</span>
                            </div>
                            <div>
                                <span class="text-gray-400 block text-[10px] uppercase">Per Kill</span>
                                <span class="font-bold text-white">${item.perKill} TK</span>
                            </div>
                            <div>
                                <span class="text-gray-400 block text-[10px] uppercase">Entry Fee</span>
                                <span class="font-bold text-white">${item.entryFee} TK</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs text-gray-400 border-t border-gray-800/60 pt-2">
                            <span>Type: <strong class="text-white">${item.type}</strong></span>
                            <span>Map: <strong class="text-white">${item.map}</strong></span>
                            <span>Device: <strong class="text-white">${item.device}</strong></span>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div class="text-xs text-gray-400">
                                <span>Only ${item.spotsTotal - item.spotsJoined} spots left</span>
                                <div class="w-24 bg-gray-800 h-1.5 rounded-full overflow-hidden mt-1">
                                    <div class="bg-red-500 h-full" style="width: ${(item.spotsJoined / item.spotsTotal) * 100}%"></div>
                                </div>
                            </div>
                            <button onclick="joinMatch(${item.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-5 py-2 rounded-xl transition">Join</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Handle Admin Form Submission for Creating Tournament
        function handleCreateTournament(event) {
            event.preventDefault();

            const title = document.getElementById('adminTitle').value;
            let imageInput = document.getElementById('adminImage').value.trim();
            const time = document.getElementById('adminMatchTime').value;
            const map = document.getElementById('adminMap').value || "Bermuda";
            const winPrize = document.getElementById('adminWinPrize').value;
            const perKill = document.getElementById('adminPerKill').value;
            const entryFee = document.getElementById('adminEntryFee').value;
            const type = document.getElementById('adminType').value;

            // Fallback logic for tournament logo
            const tournamentImage = (imageInput !== "") ? imageInput : DEFAULT_LOGO;

            const newTournament = {
                id: Date.now(),
                tag: "#NEW",
                title: title,
                time: time,
                winPrize: winPrize,
                perKill: perKill,
                entryFee: entryFee,
                type: type,
                map: map,
                device: "MOBILE",
                spotsTotal: 48,
                spotsJoined: 0,
                image: tournamentImage
            };

            tournaments.unshift(newTournament);
            renderTournaments();
            alert("টুর্নামেন্ট সফলভাবে তৈরি করা হয়েছে!");
            document.getElementById('createTournamentForm').reset();
            switchTab('play');
        }

        // Tab Switching Function
        function switchTab(tabName) {
            const tabs = ['play', 'matches', 'results', 'wallet', 'admin'];
            tabs.forEach(tab => {
                const view = document.getElementById(`view-${tab}`);
                const tabBtn = document.getElementById(`tab-${tab}`);
                if(view) view.classList.add('hidden');
                if(tabBtn) {
                    tabBtn.classList.remove('active-tab');
                    tabBtn.classList.add('text-gray-400');
                }
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            if(activeBtn) {
                activeBtn.classList.add('active-tab');
                activeBtn.classList.remove('text-gray-400');
            }
        }

        // Initialize Render
        document.addEventListener('DOMContentLoaded', () => {
            renderTournaments();
        });
    </script>
</body>
</html>
