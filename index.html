<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R2.0 ESPORTS V2 - Final</title>
<style>
:root{--bg:#07101d;--card:#101b2d;--line:#263852;--text:#eef4ff;--muted:#aebbd0;--red:#ff3b55;--cyan:#35d1c5;--gold:#ffc94d}
*{box-sizing:border-box}body{margin:0;background:#060b14;color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;background:#091321ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.brand{font-weight:900;font-size:20px}.brand b{color:var(--red)}.sub{font-size:12px;color:var(--muted)}
main{padding:14px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.hero{overflow:hidden;padding:0}.hero img{width:100%;display:block;max-height:320px;object-fit:cover}.row{display:flex;gap:10px;align-items:center}.space{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode,.item{background:#0d1828;color:white;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left}.btn{padding:12px 14px;border-radius:12px;background:var(--red);color:white;font-weight:800;width:100%}.btn.alt{background:#20314a}.btn.green{background:var(--cyan);color:#062321}.btn.gold{background:var(--gold);color:#251b00}.btn.google{background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:8px}.input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#091422;color:white;margin:6px 0}.muted{color:var(--muted)}h2,h3{margin:5px 0 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:12px}.stat{padding:10px;text-align:center;border-right:1px solid var(--line);font-size:12px}.stat:last-child{border:0}.stat b{display:block;font-size:15px;margin-top:5px;color:var(--gold)}.tag{display:inline-block;background:#74253b;padding:5px 9px;border-radius:999px;font-size:11px}.tour{padding:0;overflow:hidden}.tour.inside{padding:14px}.actions{display:flex;gap:8px;padding:12px}.actions button{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1524f0;backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30}.nav{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:var(--muted);padding:10px 2px;font-size:11px}.nav button.active{color:var(--gold);font-weight:900}.hidden{display:none!important}.avatar{width:72px;height:72px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),#695bff);font-size:30px;font-weight:900}.center{text-align:center}.adminTabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.adminTabs button{white-space:nowrap}.list{max-height:500px;overflow:auto}.tiny{font-size:12px}.danger{background:#6d1f2b}.mini{padding:7px 10px;font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;place-items:center;z-index:100;padding:14px}.modal.on{display:grid}.modalBox{background:#0f1c33;border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#20314a}.badge.full{background:#6d1f2b}
</style>
</head>
<body>
<div class="app">
<header class="top">
<img id="siteLogo" class="logo" src="https://d3tx3wg2jy0sui.cloudfront.net/eef6c3293f5b46c3b89b315b92d3e0f2.jpg">
<div><div class="brand">R2.0 <b>ESPORTS</b></div><div class="sub">V2 Final • Room System</div></div>
</header>

<main>
<!-- LOGIN PAGE - CLEANED -->
<section id="login" class="page active">
<div class="card" style="max-width:400px;margin:40px auto">
<h2 style="text-align:center">Login / Sign Up</h2>
<input id="username" class="input" placeholder="Username - যেমন R2 SALA">
<input id="email" class="input" type="email" placeholder="Email">
<input id="password" class="input" type="password" placeholder="Password (6+ chars)">
<button class="btn" onclick="loginUser()">Login</button>
<button class="btn alt" style="margin-top:8px" onclick="registerUser()">Create Account</button>
<div style="text-align:center;margin:12px 0;color:var(--muted)">or</div>
<button class="btn google" onclick="googleLogin()">🔵 Continue with Google</button>
</div>
</section>

<section id="home" class="page"><div id="bannerWrap"></div><h2>🎮 Game Modes</h2><div id="modes" class="grid"></div></section>
<section id="tournaments" class="page"><h2 id="modeTitle">Tournaments</h2><div id="tlist"></div></section>
<section id="details" class="page"><button class="btn alt" onclick="go('tournaments')">← Back</button><div id="detailBox"></div></section>
<section id="matches" class="page"><h2>📋 My Matches</h2><div id="myMatchesList"></div></section>
<section id="results" class="page"><h2>🏆 Results</h2><div id="resultsList"></div></section>
<section id="profile" class="page">
<div class="card center"><div class="avatar" id="av">R</div><h2 id="pname">Player</h2><div id="pemail" class="muted"></div><div id="isAdminBadge" class="hidden"><span class="tag" style="background:var(--gold);color:#000;margin-top:8px">👑 ADMIN</span></div></div>
<div class="card"><div class="row space"><b>Credit Balance</b><b id="points" style="color:var(--gold);font-size:20px">0 Credits</b></div><button class="btn gold" style="margin-top:10px" onclick="go('wallet')">💰 Wallet</button></div>
<button class="btn alt" onclick="logoutUser()">Logout</button>
</section>
<section id="wallet" class="page">
<h2>💰 Wallet</h2>
<div class="card"><div class="row space"><span>Available</span><b id="walletPoints" style="color:var(--gold);font-size:22px">0</b></div></div>
<div class="card">
<select id="requestType" class="input"><option value="add">💰 Deposit</option><option value="withdraw">💸 Withdraw</option></select>
<input id="requestAmount" class="input" type="number" placeholder="Amount">
<textarea id="requestNote" class="input" placeholder="TrxID / Bkash Number"></textarea>
<button class="btn" onclick="submitWalletRequest()">Submit</button></div>
<div class="card"><h3>My Requests</h3><div id="requestList"></div></div>
</section>
<section id="admin" class="page">
<h2>⚙ Admin Panel</h2><p id="adminStatus" class="tiny muted"></p>
<div id="adminContent" class="hidden">
<div class="adminTabs">
<button class="btn alt mini" onclick="adminTab('tours')">🏆 Tournaments</button>
<button class="btn alt mini" onclick="adminTab('players')">👥 Players</button>
<button class="btn alt mini" onclick="adminTab('requests')">💳 Requests</button>
</div><div id="adminBox"></div>
</div>
</section>
</main>
</div>

<nav class="bottom"><div class="nav">
<button id="nHome" onclick="go('home')">🎮<br>Play</button>
<button id="nMatches" onclick="go('matches');loadMyMatches()">📋<br>Matches</button>
<button id="nResults" onclick="go('results');loadResults()">🏆<br>Results</button>
<button id="nProfile" onclick="go('profile')">👤<br>Profile</button>
<button id="nAdmin" onclick="openAdmin()">⚙<br>Admin</button>
</div></nav>

<div id="joinModal" class="modal"><div class="modalBox">
<h3>🎮 Join Tournament</h3>
<input id="joinIGN" class="input" placeholder="IGN - R2•SALA">
<input id="joinUID" class="input" placeholder="Free Fire UID">
<input id="joinContact" class="input" placeholder="WhatsApp (optional)">
<div class="row"><button class="btn alt" onclick="closeJoinModal()">Cancel</button><button class="btn green" onclick="confirmJoin()">Confirm Join</button></div>
</div></div>

<div id="roomModal" class="modal"><div class="modalBox">
<h3>🔑 Room Setup</h3>
<input id="rId" class="input" placeholder="Room ID">
<input id="rPass" class="input" placeholder="Password">
<label class="tiny"><input type="checkbox" id="rPublished"> Publish Now (Join করা User দেখবে)</label>
<div class="row" style="margin-top:10px"><button class="btn alt" onclick="closeRoomModal()">Cancel</button><button class="btn gold" onclick="saveRoom()">Save</button></div>
</div></div>

<div id="editModal" class="modal"><div class="modalBox">
<h3>✏ Edit Tournament</h3>
<input id="eTitle" class="input" placeholder="Title"><input id="eMode" class="input" placeholder="Mode"><input id="eDate" class="input" placeholder="Date"><input id="eMap" class="input" placeholder="Map">
<input id="ePrize" class="input" type="number" placeholder="Prize"><input id="eKill" class="input" type="number" placeholder="Per Kill"><input id="eFee" class="input" type="number" placeholder="Entry Fee"><input id="eSlots" class="input" type="number" placeholder="Slots">
<textarea id="eRules" class="input" placeholder="Rules"></textarea>
<div class="row"><button class="btn alt" onclick="closeEditModal()">Cancel</button><button class="btn" onclick="saveEditTournament()">Save</button></div>
</div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {getFirestore,collection,collectionGroup,getDocs,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,where,serverTimestamp,runTransaction,increment} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig={apiKey:"AIzaSyD6uFXH6PtNK1G6MA7IdgVI1YrrWe81I44",authDomain:"r20-esports.firebaseapp.com",projectId:"r20-esports",storageBucket:"r20-esports.firebasestorage.app",messagingSenderId:"1093098377356",appId:"1:1093098377356:web:ca32c25bf149e317bceba9"};
const ADMIN_EMAILS=["salasalauddin139@gmail.com"];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,isAdmin=false,pendingJoinId=null,pendingEditId=null,pendingRoomId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const err=e=>alert(e?.message||'Error');

window.go=id=>{
 if(!user && id!=='login'){ go('login'); return; }
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 const map={home:'nHome',matches:'nMatches',results:'nResults',profile:'nProfile',admin:'nAdmin'};
 if(map[id]) $(map[id]).classList.add('active');
 if(id==='wallet') loadWallet();
};

async function loadHome(){
 let modes=['BR DUO MATCH','BR SOLO MATCH','ETB BR PRO LEAGUE','SOLO SURVIVAL','LONE WOLF','CLASH SQUAD'];
 try{const ms=(await getDocs(collection(db,'gameModes'))).docs.map(d=>d.data().name).filter(Boolean);if(ms.length) modes=ms}catch{}
 $('modes').innerHTML=modes.map(m=>`<button class="mode" onclick='openMode(${JSON.stringify(m)})'>${esc(m)}</button>`).join('');
 let banners=[]; try{banners=(await getDocs(collection(db,'banners'))).docs.map(d=>({id:d.id,...d.data()}))}catch{}
 let bannerUrl = banners.length? banners[0].imageUrl : '';
 let isAdminNow = user && ADMIN_EMAILS.includes(user.email);
 let editBtn = isAdminNow? `<button onclick="openBannerEditor('${banners.length?banners[0].id:''}')" style="position:absolute;top:8px;right:8px;background:#facc15;color:#000;padding:7px 14px;border-radius:20px;font-weight:900;font-size:13px;border:2px solid #000;z-index:5">✏️ Edit Banner</button>` : '';
 let bannerContent = bannerUrl? `<img src="${esc(bannerUrl)}" style="width:100%;height:100%;object-fit:cover;display:block">` : `<div style="width:100%;height:100%;display:grid;place-items:center;background:#1a2a4a;color:#fff;font-weight:900">No Banner<br><span style="font-size:11px">Click Edit</span></div>`;
 $('bannerWrap').innerHTML=`<div class="card hero" style="position:relative;aspect-ratio:16/9;overflow:hidden;padding:0;background:#000">${bannerContent}${editBtn}</div>`;
}
window.openBannerEditor=(id)=>{
 pendingEditId=id;
 $('adminBox').innerHTML=`<div class="card"><h3>🖼️ Banner Change (16:9)</h3><input type="file" id="bannerFile" accept="image/*" class="input"><button class="btn green" onclick="uploadBannerFile()">📁 সরাসরি ফটো Upload</button><div style="text-align:center;margin:10px 0">or</div><input id="bannerUrlInput" class="input" placeholder="https://...jpg"><button class="btn gold" onclick="uploadBannerUrl()">🔗 URL দিয়ে Save</button><button class="btn alt" style="margin-top:8px" onclick="closeBannerEditor()">Cancel</button></div>`;
 go('admin');
};
window.closeBannerEditor=()=>{adminTab('tours');};
window.uploadBannerFile=async()=>{
 let file=$('bannerFile').files[0]; if(!file){alert('ফটো সিলেক্ট করো');return;}
 let reader=new FileReader(); reader.onload=async(e)=>{
  try{
   let base64=e.target.result; let bid=pendingEditId;
   if(bid && bid!=''){await updateDoc(doc(db,'banners',bid),{imageUrl:base64,updatedAt:serverTimestamp()});}
   else{await addDoc(collection(db,'banners'),{title:'Main Banner',imageUrl:base64,active:true,createdAt:serverTimestamp()});}
   alert('✅ Photo Uploaded!'); loadHome(); adminTab('tours');
  }catch(err){alert(err.message)}
 }; reader.readAsDataURL(file);
};
window.uploadBannerUrl=async()=>{
 let url=$('bannerUrlInput').value.trim(); if(!url){alert('URL দাও');return;}
 try{let bid=pendingEditId; if(bid && bid!=''){await updateDoc(doc(db,'banners',bid),{imageUrl:url,updatedAt:serverTimestamp()});} else{await addDoc(collection(db,'banners'),{title:'Main Banner',imageUrl:url,active:true,createdAt:serverTimestamp()});} alert('✅ Updated!'); loadHome(); adminTab('tours');}catch(e){err(e)}
};
window.editBanner=window.openBannerEditor; window.addNewBanner=window.openBannerEditor;
function renderTours(ts){
 $('tlist').innerHTML=ts.length?ts.map(t=>{
   const max=Number(t.maxSlots||48), cur=Number(t.currentJoins||0), full=cur>=max;
   return `<div class="card tour"><div class="inside"><div class="row space"><span class="tag">${esc(t.mode||'')}</span><span class="badge ${full?'full':''}">${cur}/${max}</span></div><h3>${esc(t.title||'')}</h3><div class="muted">${esc(t.dateTime||'')} • ${esc(t.map||'')}</div><div class="stats"><div class="stat">PRIZE<b>${Number(t.prizePool||0)}</b></div><div class="stat">KILL<b>${Number(t.perKill||0)}</b></div><div class="stat">ENTRY<b>${Number(t.entryFee||0)}</b></div><div class="stat">SLOTS<b>${cur}/${max}</b></div></div></div><div class="actions"><button class="btn alt" onclick="openDetails('${t.id}')">Details</button><button class="btn" style="background:#1e3a8a" onclick="handleRoomClick('${t.id}')">🔑 ROOM</button><button class="btn green" ${full?'disabled':''} onclick="joinTour('${t.id}')">${full?'Full':'Join'}</button></div></div>`;
 }).join(''):'<div class="card">No tournaments</div>';
}

window.openDetails=async id=>{
 go('details');$('detailBox').innerHTML='Loading...';
 try{
  const s=await getDoc(doc(db,'tournaments',id));const t={id:s.id,...s.data()};
  let roomHtml='';
  if(user){
    const j=await getDoc(doc(db,'users',user.uid,'joinedMatches',id));
    if(!j.exists()) roomHtml='<p class="muted">❌ Join করেননি</p>';
    else if(!t.roomPublished) roomHtml='<p class="muted">🔒 ROOM LOCKED - Publish হয়নি</p>';
    else roomHtml=`<p>ID: <b>${esc(t.roomId||'')}</b></p><p>Pass: <b>${esc(t.roomPassword||'')}</b></p>`;
  }
  $('detailBox').innerHTML=`<div class="card"><h2>${esc(t.title||'')}</h2><p class="muted">${esc(t.dateTime||'')}</p></div><div class="card"><h3>🔑 Room</h3>${roomHtml}</div><button class="btn" style="background:#1e3a8a" onclick="handleRoomClick('${t.id}')">🔑 ROOM</button>`;
 }catch(e){$('detailBox').innerHTML='Failed'}
};

window.handleRoomClick=async id=>{
 if(!user){alert('Login করুন');return}
 try{
  const j=await getDoc(doc(db,'users',user.uid,'joinedMatches',id));
  if(!j.exists()){alert('❌ আপনি Join করেননি');return}
  const t=await getDoc(doc(db,'tournaments',id));const d=t.data();
  if(!d.roomPublished) {alert('🔒 ROOM LOCKED\nAdmin এখনো Publish করেনি');return}
  alert(`ROOM DETAILS\n\nID: ${d.roomId}\nPass: ${d.roomPassword}`);
 }catch(e){err(e)}
};

window.joinTour=id=>{pendingJoinId=id;$('joinModal').classList.add('on')};
window.closeJoinModal=()=>{$('joinModal').classList.remove('on');pendingJoinId=null};
window.confirmJoin=async()=>{
 const ign=$('joinIGN').value.trim(), uid=$('joinUID').value.trim();
 if(!ign||!uid){alert('IGN & UID দিন');return}
 try{
  const ref=doc(db,'users',user.uid),joinRef=doc(db,'users',user.uid,'joinedMatches',pendingJoinId),tref=doc(db,'tournaments',pendingJoinId),playerRef=doc(db,'tournaments',pendingJoinId,'players',user.uid);
  await runTransaction(db,async tx=>{
   const us=await tx.get(ref),ts=await tx.get(tref),js=await tx.get(joinRef);
   if(js.exists()) throw Error('Already Joined');
   const fee=Number(ts.data().entryFee||0), bal=Number(us.data().credits||0);
   if(bal<fee) throw Error('Balance কম');
   if(Number(ts.data().currentJoins||0)>=Number(ts.data().maxSlots||48)) throw Error('Full');
   tx.set(ref,{credits:bal-fee},{merge:true});
   tx.set(joinRef,{tournamentId:pendingJoinId,title:ts.data().title||'',ign,ffUid:uid,joinedAt:serverTimestamp()});
   tx.set(playerRef,{uid:user.uid,email:user.email,ign,ffUid:uid,joinedAt:serverTimestamp()});
   tx.update(tref,{currentJoins:increment(1)});
  });
  closeJoinModal();alert('Joined');loadProfile();
 }catch(e){err(e)}
};

async function loadProfile(){
 if(!user) return;
 try{
  const s=await getDoc(doc(db,'users',user.uid));const d=s.data()||{};
  $('pname').textContent=d.name||user.email.split('@')[0];$('pemail').textContent=user.email;$('av').textContent=(d.name||'R').charAt(0).toUpperCase();$('points').textContent=Number(d.credits||0)+' Credits';
  if(ADMIN_EMAILS.includes(user.email)) $('isAdminBadge').classList.remove('hidden');
 }catch{}
}
async function loadMyMatches(){
 if(!user) return;
 try{
  const j=await getDocs(collection(db,'users',user.uid,'joinedMatches'));let html='';
  for(const docSnap of j.docs){
   const x=docSnap.data(); let t={}; try{const ts=await getDoc(doc(db,'tournaments',x.tournamentId)); if(ts.exists()) t=ts.data()}catch{}
   let roomBox=!t.roomPublished?`<div style="padding:8px;background:#1f2937;border-radius:8px;margin-top:8px;text-align:center">🔒 ROOM LOCKED</div>`:`<div style="padding:8px;background:#052e16;border:1px solid #22c55e;border-radius:8px;margin-top:8px">ID: <b>${esc(t.roomId||'')}</b> | Pass: <b>${esc(t.roomPassword||'')}</b></div>`;
   html+=`<div class="card"><b>${esc(x.title||'Tournament')}</b><div class="tiny">IGN: ${esc(x.ign||'')} | UID: ${esc(x.ffUid||'')}</div>${roomBox}</div>`;
  }
  $('myMatchesList').innerHTML=html||'<div class="card">No matches</div>';
 }catch{$('myMatchesList').innerHTML='Failed'}
}
async function loadResults(){try{const a=(await getDocs(collection(db,'results'))).docs.map(d=>d.data());$('resultsList').innerHTML=a.map(x=>`<div class="card"><b>${esc(x.title||'')}</b><p>${esc(x.text||'')}</p></div>`).join('')||'No results'}catch{}}
async function loadWallet(){try{const s=await getDoc(doc(db,'users',user.uid));$('walletPoints').textContent=Number(s.data().credits||0);const q=await getDocs(collection(db,'walletRequests',user.uid,'items'));$('requestList').innerHTML=q.docs.map(d=>`<div class="item">${esc(d.data().type)} - ${d.data().amount} - ${d.data().status}</div>`).join('')||'No requests'}catch{}}
window.submitWalletRequest=async()=>{const amount=Number($('requestAmount').value),type=$('requestType').value,note=$('requestNote').value;if(!amount) return alert('Amount দিন');await addDoc(collection(db,'walletRequests',user.uid,'items'),{type,amount,note,status:'pending',createdAt:serverTimestamp(),email:user.email,uid:user.uid});alert('Submitted');loadWallet()};

window.loginUser=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){err(e)}};
window.registerUser=async()=>{try{const email=$('email').value.trim(),pass=$('password').value,name=$('username').value.trim();const c=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,'users',c.user.uid),{email,name,credits:0,createdAt:serverTimestamp()},{merge:true});alert('Account Created')}catch(e){err(e)}};
window.googleLogin=async()=>{try{const provider=new GoogleAuthProvider();const res=await signInWithPopup(auth,provider);await setDoc(doc(db,'users',res.user.uid),{email:res.user.email,name:res.user.displayName||res.user.email.split('@')[0],credits:0,updatedAt:serverTimestamp()},{merge:true})}catch(e){err(e)}};
window.logoutUser=async()=>{await signOut(auth)};

async function checkAdmin(){if(!user) return false; if(ADMIN_EMAILS.includes(user.email)) {isAdmin=true;return true} try{const s=await getDoc(doc(db,'admins',user.uid));isAdmin=s.exists();return isAdmin}catch{return false}}
window.openAdmin=async()=>{go('admin');const ok=await checkAdmin();$('adminStatus').textContent=ok?'Admin: '+user.email:'Not Admin';$('adminContent').classList.toggle('hidden',!ok);if(ok) adminTab('tours')};
window.adminTab=async tab=>{
 const box=$('adminBox');
 if(tab==='tours'){const ts=(await getDocs(collection(db,'tournaments'))).docs.map(d=>({id:d.id,...d.data()}));box.innerHTML=`<div class="card"><h3>Create</h3><input id="tTitle" class="input" placeholder="Title"><input id="tMode" class="input" placeholder="Mode"><input id="tDate" class="input" placeholder="Date"><input id="tMap" class="input" placeholder="Map"><input id="tPrize" class="input" type="number" placeholder="Prize"><input id="tFee" class="input" type="number" placeholder="Fee"><input id="tSlots" class="input" type="number" placeholder="Slots 48"><button class="btn" onclick="addTournament()">Publish</button></div><div class="card list">${ts.map(t=>`<div class="item"><b>${esc(t.title)}</b> ${t.roomPublished?'<span class="badge" style="background:green">LIVE</span>':'<span class="badge">LOCKED</span>'}<br><button class="btn alt mini" onclick="editTournament('${t.id}')">Edit</button><button class="btn gold mini" onclick="manageRoom('${t.id}')">🔑 Room</button><button class="btn danger mini" onclick="delTournament('${t.id}')">Del</button></div>`).join('')}</div>`}
 if(tab==='players'){let html='<div class="card"><h3>Players</h3>';const tours=(await getDocs(collection(db,'tournaments'))).docs.map(d=>({id:d.id}));for(const t of tours){const ps=(await getDocs(collection(db,'tournaments',t.id,'players'))).docs.map(d=>d.data());html+=`<div class="tiny">${t.id}: ${ps.length} players</div>`+ps.map(p=>`<div class="item tiny"><b>${esc(p.ign)}</b> ${esc(p.ffUid)}</div>`).join('')}html+='</div>';box.innerHTML=html}
 if(tab==='requests'){const rs=(await getDocs(collectionGroup(db,'items'))).docs.map(d=>({path:d.ref.path,...d.data()})).filter(x=>x.status==='pending');box.innerHTML=`<div class="card"><h3>Requests ${rs.length}</h3>${rs.map(r=>`<div class="item"><b>${esc(r.email)} ${r.type} ${r.amount}</b><br><button class="btn green mini" onclick="reviewRequest('${r.path}','approve')">Approve</button><button class="btn danger mini" onclick="reviewRequest('${r.path}','reject')">Reject</button></div>`).join('')}</div>`}
};
window.addTournament=async()=>{const data={title:$('tTitle').value,mode:$('tMode').value,dateTime:$('tDate').value,map:$('tMap').value,prizePool:Number($('tPrize').value||0),entryFee:Number($('tFee').value||0),maxSlots:Number($('tSlots').value||48),currentJoins:0,roomPublished:false,roomId:'',roomPassword:'',createdAt:serverTimestamp()};await addDoc(collection(db,'tournaments'),data);alert('Published');adminTab('tours')};
window.delTournament=async id=>{if(!confirm('Delete?'))return;await deleteDoc(doc(db,'tournaments',id));adminTab('tours')};
window.editTournament=async id=>{const s=await getDoc(doc(db,'tournaments',id));const t=s.data();pendingEditId=id;$('eTitle').value=t.title||'';$('eMode').value=t.mode||'';$('eDate').value=t.dateTime||'';$('eMap').value=t.map||'';$('ePrize').value=t.prizePool||0;$('eFee').value=t.entryFee||0;$('eSlots').value=t.maxSlots||48;$('editModal').classList.add('on')};
window.closeEditModal=()=>{$('editModal').classList.remove('on');pendingEditId=null};
window.saveEditTournament=async()=>{await updateDoc(doc(db,'tournaments',pendingEditId),{title:$('eTitle').value,mode:$('eMode').value,dateTime:$('eDate').value,map:$('eMap').value,prizePool:Number($('ePrize').value||0),entryFee:Number($('eFee').value||0),maxSlots:Number($('eSlots').value||48)});closeEditModal();adminTab('tours')};
window.manageRoom=async id=>{const s=await getDoc(doc(db,'tournaments',id));pendingRoomId=id;$('rId').value=s.data().roomId||'';$('rPass').value=s.data().roomPassword||'';$('rPublished').checked=!!s.data().roomPublished;$('roomModal').classList.add('on')};
window.closeRoomModal=()=>{$('roomModal').classList.remove('on');pendingRoomId=null};
window.saveRoom=async()=>{await updateDoc(doc(db,'tournaments',pendingRoomId),{roomId:$('rId').value,roomPassword:$('rPass').value,roomPublished:$('rPublished').checked});closeRoomModal();alert($('rPublished').checked?'Published - Join করা User দেখবে':'Saved as Locked');adminTab('tours')};
window.viewPlayers=async id=>{const ps=(await getDocs(collection(db,'tournaments',id,'players'))).docs.map(d=>d.data());$('adminBox').innerHTML=`<div class="card"><h3>Players ${ps.length}</h3>${ps.map(p=>`<div class="item"><b>${esc(p.ign)}</b> ${esc(p.ffUid)}</div>`).join('')}</div>`};
window.reviewRequest=async(path,action)=>{const ref=doc(db,...path.split('/'));await runTransaction(db,async tx=>{const rs=await tx.get(ref);const r=rs.data();const uref=doc(db,'users',r.uid);const us=await tx.get(uref);const bal=Number(us.data().credits||0),amount=Number(r.amount||0);if(action==='approve'){if(r.type==='add') tx.set(uref,{credits:bal+amount},{merge:true});else tx.set(uref,{credits:bal-amount},{merge:true})}tx.update(ref,{status:action==='approve'?'approved':'rejected'})});alert(action);adminTab('requests')};

onAuthStateChanged(auth,async u=>{
 user=u;
 if(u){
  await setDoc(doc(db,'users',u.uid),{email:u.email,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
  await loadProfile(); go('home'); loadHome();
 }else{
  go('login');
 }
});
</script>
</body>
</html>
